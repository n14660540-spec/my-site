<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Найди работу легко!</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 30px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        h1 {
            text-align: center;
            font-size: 32px;
            color: #ffd700;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 24px;
        }
        .question-block {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 16px;
            border-left: 4px solid #ffd700;
        }
        .question-block .q {
            font-weight: 600;
            font-size: 17px;
            margin-bottom: 10px;
            color: #fff;
        }
        .options label {
            display: block;
            padding: 8px 14px;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
            font-size: 15px;
        }
        .options label:hover {
            background: rgba(255, 215, 0, 0.08);
        }
        .options input[type="radio"] {
            margin-right: 10px;
            accent-color: #ffd700;
            transform: scale(1.1);
        }
        .options label.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.12);
        }
        .result-box {
            text-align: center;
            margin-top: 25px;
            padding: 20px;
            border-radius: 20px;
            background: rgba(255, 215, 0, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
        .result-box .score {
            font-size: 48px;
            font-weight: 900;
            color: #ffd700;
        }
        .result-box .label {
            font-size: 22px;
            font-weight: bold;
            margin-top: 6px;
        }
        .result-box .desc {
            color: #bbb;
            margin-top: 10px;
            font-size: 16px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 32px;
            background: linear-gradient(145deg, #ffd700, #f0a500);
            border: none;
            border-radius: 60px;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.2);
        }
        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 48px rgba(255, 215, 0, 0.35);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .btn-confirm {
            background: linear-gradient(145deg, #00c853, #00a844);
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 200, 80, 0.2);
        }
        .btn-confirm:hover {
            box-shadow: 0 12px 48px rgba(0, 200, 80, 0.35);
        }
        .btn-confirm:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .footer {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 20px;
        }
        .hidden {
            display: none;
        }
        .register-box {
            text-align: center;
            padding: 30px 20px;
        }
        .register-box input {
            display: block;
            width: 80%;
            max-width: 300px;
            margin: 10px auto;
            padding: 12px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 16px;
            outline: none;
            text-align: center;
        }
        .register-box input:focus {
            border-color: #ffd700;
        }
        .register-box .btn {
            margin-top: 10px;
        }
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 15px;
        }
        .results-table th {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            padding: 10px;
            border-bottom: 2px solid #ffd700;
        }
        .results-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }
        .results-table tr:hover td {
            background: rgba(255, 215, 0, 0.05);
        }
        .results-table .gold {
            color: #ffd700;
            font-weight: bold;
        }
        .results-table .silver {
            color: #c0c0c0;
            font-weight: bold;
        }
        .results-table .bronze {
            color: #cd7f32;
            font-weight: bold;
        }

        .review-block {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px 20px;
            margin: 12px 0;
            border-left: 4px solid #ffd700;
        }
        .review-block .q {
            font-weight: 600;
            font-size: 16px;
        }
        .review-block .answer {
            margin-top: 6px;
            font-size: 15px;
        }
        .review-block .correct {
            color: #4caf50;
        }
        .review-block .wrong {
            color: #ff6b6b;
        }
        .review-block .explain {
            color: #aaa;
            font-size: 14px;
            margin-top: 4px;
        }

        /* ===== ПЛЕЕР МЕЛСТРОЯ ===== */
        .melnik-player {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 999;
            background: rgba(20, 20, 40, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            padding: 10px 18px 10px 20px;
            display: none;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: 0.3s;
        }
        .melnik-player.active {
            display: flex;
        }
        .melnik-player .label {
            color: #ffd700;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .melnik-player .btn-play {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            color: #fff;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .melnik-player .btn-play:hover {
            background: rgba(255, 215, 0, 0.25);
        }
        .melnik-player .btn-play.playing {
            background: rgba(255, 107, 107, 0.2);
            border-color: #ff6b6b;
        }
        .melnik-player .volume-slider {
            width: 60px;
            accent-color: #ffd700;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            .melnik-player {
                bottom: 16px;
                left: 16px;
                padding: 8px 14px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .melnik-player .label {
                font-size: 12px;
            }
            .melnik-player .volume-slider {
                width: 40px;
            }
        }

        @media (max-width: 600px) {
            .container { padding: 16px; }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Тест: «Найди работу легко»</h1>
        <div class="subtitle">Ответь на 10 вопросов и узнай, готов ли ты к поиску работы</div>

        <!-- ===== РЕГИСТРАЦИЯ ===== -->
        <div id="registerBox" class="register-box">
            <h2 style="color:#ffd700; margin-bottom:16px;">👤 Введите ваши данные</h2>
            <input type="text" id="firstName" placeholder="Имя">
            <input type="text" id="lastName" placeholder="Фамилия">
            <button class="btn" onclick="registerUser()">✅ Начать тест</button>
        </div>

        <!-- ===== ТЕСТ ===== -->
        <div id="testContainer" class="hidden">
            <div id="quizContainer"></div>
            <div style="text-align:center; margin-top:20px;">
                <button class="btn btn-confirm" id="confirmBtn" onclick="calculateResult()">✅ Подтвердить ответы</button>
            </div>
        </div>

        <!-- ===== РЕЗУЛЬТАТ ===== -->
        <div id="resultBox" class="result-box hidden">
            <div class="score" id="scoreDisplay">0</div>
            <div class="label" id="labelDisplay">—</div>
            <div class="desc" id="descDisplay"></div>
            <div id="reviewContainer" style="text-align:left; margin-top:20px;"></div>
            <button class="btn" onclick="resetQuiz()">🔄 Пройти заново</button>
            <br>
            <button class="btn btn-secondary" onclick="showResults()">📊 Посмотреть результаты всех</button>
            <button class="btn btn-secondary" onclick="window.location.href='index.html'">🏠 На главную</button>
        </div>

        <!-- ===== ТАБЛИЦА РЕЗУЛЬТАТОВ ===== -->
        <div id="resultsContainer" class="hidden">
            <h2 style="color:#ffd700; text-align:center; margin-bottom:16px;">📊 Результаты участников</h2>
            <div id="resultsTableContainer"></div>
            <button class="btn btn-secondary" onclick="backToTest()" style="margin-top:16px;">← Вернуться к тесту</button>
            <button class="btn btn-secondary" onclick="window.location.href='index.html'">🏠 На главную</button>
        </div>

        <div class="footer">
            🌟 <strong>Найти работу легко</strong> — даже если тебе 11–13 лет
        </div>
    </div>

    <!-- ===== ПЛЕЕР МЕЛСТРОЯ ===== -->
    <div class="melnik-player" id="melnikPlayer">
        <span class="label">🎵 Меллстрой</span>
        <button class="btn-play" id="playBtn">▶️ Включить</button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50">
        <audio id="melnikAudio" loop preload="auto">
            <source src="melnik.mp3" type="audio/mpeg">
            Ваш браузер не поддерживает аудио.
        </audio>
    </div>

    <script>
        // ============================================================
        //  FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBOvMRic7O8ArU0FA80WtjcyjjmAN9webg",
            authDomain: "site-a091e.firebaseapp.com",
            projectId: "site-a091e",
            storageBucket: "site-a091e.firebasestorage.app",
            messagingSenderId: "787167206172",
            appId: "1:787167206172:web:d676ff89710941b1d238d9",
            measurementId: "G-XVTN0DM7NB"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================
        //  ВОПРОСЫ
        // ============================================================
        const questions = [
            { q: 'Что лучше всего написать в теме письма работодателю на Авито?', options: ['А) «Вакансия, отклик»', 'Б) «Ищу работу, срочно!»', 'В) «Курьер в ваш район, готов сегодня»'], scores: [1, 0, 2], correct: 2, explain: 'Работодателю важна конкретика. «Курьер в ваш район, готов сегодня» показывает, что вы уже изучили вакансию и готовы действовать.' },
            { q: 'Какую зарплату указать в графе «Пожелания по оплате» новичку без опыта?', options: ['А) 100 000 рублей', 'Б) «По договоренности»', 'В) Минималку'], scores: [0, 2, 1], correct: 1, explain: '«По договоренности» — лучший ответ, потому что вы не знаете рынок и не отпугиваете работодателя завышенными или заниженными требованиями.' },
            { q: 'Что написать в разделе «О себе», чтобы выделиться из 100 откликов?', options: ['А) «Коммуникабельный, стрессоустойчивый, ответственный»', 'Б) «Не опаздываю, не курю, не зависаю в телефоне»', 'В) «Люблю животных и слушать музыку»'], scores: [1, 2, 0], correct: 1, explain: 'Конкретные обещания (не опаздываю, не курю) работают лучше общих шаблонных фраз. Работодатель видит, что вы думаете о его удобстве.' },
            { q: 'У вас нет опыта работы. Что вы напишете в блоке «Опыт»?', options: ['А) Оставлю поле пустым', 'Б) Напишу: «Помогал в школьной ярмарке, разгружал товар»', 'В) Придумаю стажировку в компании, где не работал'], scores: [0, 2, 0], correct: 1, explain: 'Лучше честно написать о реальном, даже маленьком опыте, чем придумывать. Честность ценится выше.' },
            { q: 'Какое фото лучше всего поставить в резюме?', options: ['А) Селфи в темной комнате с наушниками', 'Б) Качественное фото на нейтральном фоне в опрятной футболке/рубашке', 'В) Вообще без фото'], scores: [0, 2, 1], correct: 1, explain: 'Опрятное фото на нейтральном фоне — это признак уважения к работодателю. Оно создаёт первое впечатление о вас.' },
            { q: 'Вы нашли вакансию курьера. Что вы напишете в сопроводительном сообщении?', options: ['А) «Здравствуйте, возьмете меня?»', 'Б) «Я живу за углом от вашего офиса, могу приехать на собеседование через 10 минут»', 'В) Расскажу историю своей жизни и почему я хочу работать'], scores: [0, 2, 0], correct: 1, explain: 'Работодатель ценит конкретику и готовность действовать. Ваше удобство для него — это плюс.' },
            { q: 'Работодатель сказал: «Ты слишком молодой». Ваш ответ?', options: ['А) Растеряюсь и скажу «Извините»', 'Б) Скажу: «Я понимаю, но я быстро учусь, и мне не нужен перерыв на обед по ТК»', 'В) Скажу, что у меня есть разрешение от родителей'], scores: [0, 2, 1], correct: 1, explain: 'Вы не оправдываетесь, а переводите недостаток (молодость) в преимущество (быстро учусь, не трачу время на перекуры).' },
            { q: 'Что из перечисленного НЕЛЬЗЯ писать в резюме подростку?', options: ['А) Знание ПК и офисных программ', 'Б) Оценки в школьном аттестате (троек/пятерок)', 'В) Контактный номер телефона мамы'], scores: [2, 0, 1], correct: 2, explain: 'Номер мамы — это не контакт соискателя. Работодатель должен звонить вам, а не родителям. Это выглядит несерьёзно.' },
            { q: 'Вы опоздали на собеседование на 5 минут. Ваши действия?', options: ['А) Промолчать, надеясь, что не заметят', 'Б) Извиниться и предложить перенести, если им неудобно', 'В) Сказать, что виноваты пробки'], scores: [0, 2, 1], correct: 1, explain: 'Извиниться и предложить перенести — это зрелый шаг. Вы показываете уважение к чужому времени.' },
            { q: 'Вам предлагают «черную зарплату» в конверте. Ваше решение?', options: ['А) Согласиться, так как деньги нужны срочно', 'Б) Уточнить: «А можем официально? Я хочу иметь стаж в трудовой»', 'В) Сразу отказаться и уйти'], scores: [0, 2, 1], correct: 1, explain: 'Лучше уточнить про официальное оформление. Это показывает, что вы думаете о будущем и не боитесь задавать вопросы.' }
        ];

        let currentUser = null;
        let userAnswers = [];

        // ============================================================
        //  ПЛЕЕР МЕЛСТРОЯ (исправленный)
        // ============================================================
        const melnikPlayer = document.getElementById('melnikPlayer');
        const audio = document.getElementById('melnikAudio');
        const playBtn = document.getElementById('playBtn');
        const volumeSlider = document.getElementById('volumeSlider');

        let isPlaying = false;
        let isPlayerReady = false;

        // Проверяем, загрузился ли аудиофайл
        audio.addEventListener('canplaythrough', () => {
            isPlayerReady = true;
            console.log('✅ Аудио загружено и готово к воспроизведению');
        });

        audio.addEventListener('error', (e) => {
            console.error('❌ Ошибка загрузки аудио:', e);
            alert('Не удалось загрузить аудиофайл. Проверьте, что файл melnik.mp3 лежит рядом с test.html.');
        });

        function showPlayer() {
            melnikPlayer.classList.add('active');
        }

        playBtn.addEventListener('click', () => {
            if (!isPlayerReady) {
                alert('Аудио ещё не загружено. Попробуйте через секунду.');
                return;
            }

            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶️ Включить';
                playBtn.classList.remove('playing');
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    playBtn.textContent = '⏸️ Пауза';
                    playBtn.classList.add('playing');
                    isPlaying = true;
                }).catch((error) => {
                    console.error('Ошибка воспроизведения:', error);
                    alert('Не удалось воспроизвести аудио. Попробуйте перезагрузить страницу.');
                });
            }
        });

        volumeSlider.addEventListener('input', () => {
            audio.volume = volumeSlider.value / 100;
        });

        // ============================================================
        //  РЕГИСТРАЦИЯ
        // ============================================================
        function registerUser() {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            if (!firstName || !lastName) {
                alert('Пожалуйста, введите имя и фамилию');
                return;
            }
            currentUser = { firstName, lastName };
            document.getElementById('registerBox').classList.add('hidden');
            document.getElementById('testContainer').classList.remove('hidden');
            showPlayer();
            renderQuiz();
        }

        // ============================================================
        //  ТЕСТ
        // ============================================================
        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';
            questions.forEach((q, idx) => {
                const block = document.createElement('div');
                block.className = 'question-block';
                block.innerHTML = `<div class="q">${idx + 1}. ${q.q}</div><div class="options">`;
                q.options.forEach((opt, oi) => {
                    block.innerHTML += `
                        <label>
                            <input type="radio" name="q${idx}" value="${oi}" data-score="${q.scores[oi]}">
                            ${opt}
                        </label>
                    `;
                });
                block.innerHTML += '</div>';
                container.appendChild(block);
            });

            document.querySelectorAll('input[type="radio"]').forEach(el => {
                el.addEventListener('change', function() {
                    const parent = this.closest('.options');
                    parent.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
                    this.closest('label').classList.add('selected');
                });
            });
        }

        // ============================================================
        //  РЕЗУЛЬТАТ
        // ============================================================
        async function calculateResult() {
            let total = 0;
            let answered = 0;
            userAnswers = [];

            questions.forEach((q, idx) => {
                const checked = document.querySelector(`input[name="q${idx}"]:checked`);
                if (checked) {
                    answered++;
                    const selected = parseInt(checked.value);
                    const isCorrect = (selected === q.correct);
                    total += parseInt(checked.dataset.score);
                    userAnswers.push({
                        question: q.q,
                        userAnswer: q.options[selected],
                        correctAnswer: q.options[q.correct],
                        isCorrect: isCorrect,
                        explain: q.explain
                    });
                } else {
                    userAnswers.push({
                        question: q.q,
                        userAnswer: 'Не выбран',
                        correctAnswer: q.options[q.correct],
                        isCorrect: false,
                        explain: q.explain
                    });
                }
            });

            if (answered < questions.length) {
                alert('Пожалуйста, ответьте на все 10 вопросов!');
                return;
            }

            let label = '', desc = '';
            if (total >= 18) {
                label = '🏆 Золотой кандидат';
                desc = 'Ваше резюме в топе! Вы понимаете психологию работодателя. Смело рассылайте отклики — вас позовут в первую очередь.';
            } else if (total >= 12) {
                label = '🥈 Серебряный кандидат';
                desc = 'Вы на правильном пути, но есть слабые места. Перечитайте вопросы, где выбрали ответы на 0–1 балл — это ваши точки роста.';
            } else {
                label = '📘 Стажер-новичок';
                desc = 'Не расстраивайтесь! Вы пока мыслите как школьник, а не как сотрудник. Запомните золотое правило: работодателю важны не ВЫ, а ВАШЕ УДОБСТВО и ОТСУТСТВИЕ ПРОБЛЕМ.';
            }

            try {
                await db.collection('results').add({
                    name: `${currentUser.firstName} ${currentUser.lastName}`,
                    score: total,
                    label: label,
                    date: new Date().toISOString()
                });
                console.log('✅ Результат сохранён в Firebase');
            } catch (e) {
                console.error('❌ Ошибка сохранения:', e);
            }

            document.getElementById('scoreDisplay').textContent = total;
            document.getElementById('labelDisplay').textContent = label;
            document.getElementById('descDisplay').textContent = desc;

            const reviewContainer = document.getElementById('reviewContainer');
            reviewContainer.innerHTML = '<h3 style="color:#ffd700; margin-bottom:12px;">📝 Разбор ответов</h3>';
            userAnswers.forEach((item, idx) => {
                const status = item.isCorrect ? '✅' : '❌';
                const colorClass = item.isCorrect ? 'correct' : 'wrong';
                const block = document.createElement('div');
                block.className = 'review-block';
                block.innerHTML = `
                    <div class="q">${idx+1}. ${item.question}</div>
                    <div class="answer">${status} <span class="${colorClass}">Ваш ответ: ${item.userAnswer}</span></div>
                    <div class="answer correct">✅ Правильный ответ: ${item.correctAnswer}</div>
                    <div class="explain">💡 Пояснение: ${item.explain}</div>
                `;
                reviewContainer.appendChild(block);
            });

            document.getElementById('testContainer').classList.add('hidden');
            document.getElementById('confirmBtn').classList.add('hidden');
            document.getElementById('resultBox').classList.remove('hidden');

            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶️ Включить';
                playBtn.classList.remove('playing');
                isPlaying = false;
            }
        }

        // ============================================================
        //  ПОКАЗАТЬ РЕЗУЛЬТАТЫ ВСЕХ
        // ============================================================
        async function showResults() {
            const container = document.getElementById('resultsTableContainer');
            container.innerHTML = '<p style="text-align:center; color:#aaa;">⏳ Загрузка...</p>';

            try {
                const snapshot = await db.collection('results')
                    .orderBy('score', 'desc')
                    .get();

                if (snapshot.empty) {
                    container.innerHTML = '<p style="text-align:center; color:#aaa;">Пока нет результатов</p>';
                } else {
                    let html = `<table class="results-table">
                        <tr><th>#</th><th>Имя</th><th>Баллы</th><th>Результат</th><th>Дата</th></tr>`;
                    let i = 1;
                    snapshot.forEach(doc => {
                        const r = doc.data();
                        const rankClass = r.score >= 18 ? 'gold' : (r.score >= 12 ? 'silver' : 'bronze');
                        html += `<tr>
                            <td>${i++}</td>
                            <td>${r.name}</td>
                            <td>${r.score}</td>
                            <td class="${rankClass}">${r.label}</td>
                            <td>${new Date(r.date).toLocaleString()}</td>
                        </tr>`;
                    });
                    html += '</table>';
                    container.innerHTML = html;
                }
            } catch (e) {
                console.error('❌ Ошибка загрузки:', e);
                container.innerHTML = '<p style="text-align:center; color:#ff6b6b;">Ошибка загрузки результатов</p>';
            }

            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('resultsContainer').classList.remove('hidden');
        }

        function backToTest() {
            document.getElementById('resultsContainer').classList.add('hidden');
            document.getElementById('resultBox').classList.remove('hidden');
        }

        function resetQuiz() {
            document.getElementById('registerBox').classList.remove('hidden');
            document.getElementById('testContainer').classList.add('hidden');
            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('resultsContainer').classList.add('hidden');
            document.getElementById('firstName').value = '';
            document.getElementById('lastName').value = '';
            document.querySelectorAll('input[type="radio"]').forEach(el => {
                el.checked = false;
                el.closest('label').classList.remove('selected');
            });
            currentUser = null;
            userAnswers = [];

            melnikPlayer.classList.remove('active');
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶️ Включить';
                playBtn.classList.remove('playing');
                isPlaying = false;
            }
        }
    </script>
</body>
</html>
